image: node:24

clone:
  depth: full

definitions:
  caches:
    node: ~/.npm
    sonar: ~/.sonar
  steps:
    - step: &quality-checks
        name: Backend Quality Checks & SonarQube Analysis
        caches:
          - node
          - sonar
        script:
          - rm -rf node_modules
          - npm ci
          - npx prisma generate
          - npm run lint
          - npm run type-check
          - npm run test -- --coverage --coverageReporters=lcov --coverageReporters=text
          - npm run build
          - export S_URL="${SONAR_HOST_URL:-${sonar_host_url:-$SONAR_URL}}"
          - export S_TOKEN="${SONAR_TOKEN:-${sonar_token:-$SONAR_SECRET}}"
          - |
            if [ -n "$S_URL" ] && [ -n "$S_TOKEN" ]; then
              echo "Executing SonarQube analysis for $S_URL..."
            else
              echo "WARNING: SONAR_HOST_URL or SONAR_TOKEN is not configured in Bitbucket variables."
              echo "Please set SONAR_HOST_URL and SONAR_TOKEN under Repository Settings -> Repository variables."
            fi
          - pipe: sonarsource/sonarqube-scan:4.0.1
            variables:
              SONAR_HOST_URL: ${SONAR_HOST_URL:-${sonar_host_url:-$SONAR_URL}}
              SONAR_TOKEN: ${SONAR_TOKEN:-${sonar_token:-$SONAR_SECRET}}
              EXTRA_ARGS: '-Dsonar.nodejs.executable=node'
    - step: &build-staging-image
        name: Build & Push Staging Docker Image
        image: docker:24.0.9
        services:
          - docker
        script:
          - export DH_USER="${DOCKER_USERNAME:-${DOCKERHUB_USERNAME:-${docker_username:-$DOCKER_USER}}}"
          - export DH_TOKEN="${DOCKER_TOKEN:-${DOCKERHUB_TOKEN:-${docker_tocken:-${docker_token:-$DOCKER_TOCKEN}}}}"
          - echo "Authenticating with Docker Hub as user '$DH_USER'..."
          - echo "$DH_TOKEN" | docker login --username "$DH_USER" --password-stdin
          - export DOCKER_BUILDKIT=0
          - export SHORT_SHA=$(echo $BITBUCKET_COMMIT | cut -c1-7)
          - docker build --platform linux/amd64 -t tariqsulehri/rct-backend:staging -t tariqsulehri/rct-backend:staging-$SHORT_SHA .
          - docker push tariqsulehri/rct-backend:staging
          - docker push tariqsulehri/rct-backend:staging-$SHORT_SHA
    - step: &build-master-image
        name: Build & Push Production Master Image
        image: docker:24.0.9
        services:
          - docker
        script:
          - export DH_USER="${DOCKER_USERNAME:-${DOCKERHUB_USERNAME:-${docker_username:-$DOCKER_USER}}}"
          - export DH_TOKEN="${DOCKER_TOKEN:-${DOCKERHUB_TOKEN:-${docker_tocken:-${docker_token:-$DOCKER_TOCKEN}}}}"
          - echo "Authenticating with Docker Hub as user '$DH_USER'..."
          - echo "$DH_TOKEN" | docker login --username "$DH_USER" --password-stdin
          - export DOCKER_BUILDKIT=0
          - export SHORT_SHA=$(echo $BITBUCKET_COMMIT | cut -c1-7)
          - export TIMESTAMP=$(date +'%m%d%y-%H%M%S')
          - export PKG_VERSION=$(node -p "require('./package.json').version")
          - docker build --platform linux/amd64 -t tariqsulehri/rct-backend:latest -t tariqsulehri/rct-backend:production -t tariqsulehri/rct-backend:production-$SHORT_SHA -t tariqsulehri/rct-backend:v$PKG_VERSION-$TIMESTAMP -t tariqsulehri/rct-backend:latest-$TIMESTAMP .
          - docker push tariqsulehri/rct-backend:latest
          - docker push tariqsulehri/rct-backend:production
          - docker push tariqsulehri/rct-backend:production-$SHORT_SHA
          - docker push tariqsulehri/rct-backend:v$PKG_VERSION-$TIMESTAMP
          - docker push tariqsulehri/rct-backend:latest-$TIMESTAMP

pipelines:
  branches:
    dev:
      - step: *quality-checks
      - step:
          name: Build & Push Dev Docker Image
          image: docker:24.0.9
          services:
            - docker
          script:
            - export DH_USER="${DOCKER_USERNAME:-${DOCKERHUB_USERNAME:-${docker_username:-$DOCKER_USER}}}"
            - export DH_TOKEN="${DOCKER_TOKEN:-${DOCKERHUB_TOKEN:-${docker_tocken:-${docker_token:-$DOCKER_TOCKEN}}}}"
            - echo "Authenticating with Docker Hub as user '$DH_USER'..."
            - echo "$DH_TOKEN" | docker login --username "$DH_USER" --password-stdin
            - export DOCKER_BUILDKIT=0
            - export SHORT_SHA=$(echo $BITBUCKET_COMMIT | cut -c1-7)
            - docker build --platform linux/amd64 -t tariqsulehri/rct-backend:dev -t tariqsulehri/rct-backend:dev-$SHORT_SHA .
            - docker push tariqsulehri/rct-backend:dev
            - docker push tariqsulehri/rct-backend:dev-$SHORT_SHA

    staging:
      - step: *quality-checks
      - step: *build-staging-image

    master:
      - step: *quality-checks
      - step: *build-master-image

    main:
      - step: *quality-checks
      - step: *build-master-image

  tags:
    'v*.*.*':
      - step: *quality-checks
      - step:
          name: Build & Push Release SemVer Image
          image: docker:24.0.9
          services:
            - docker
          script:
            - export DH_USER="${DOCKER_USERNAME:-${DOCKERHUB_USERNAME:-${docker_username:-$DOCKER_USER}}}"
            - export DH_TOKEN="${DOCKER_TOKEN:-${DOCKERHUB_TOKEN:-${docker_tocken:-${docker_token:-$DOCKER_TOCKEN}}}}"
            - echo "Authenticating with Docker Hub as user '$DH_USER'..."
            - echo "$DH_TOKEN" | docker login --username "$DH_USER" --password-stdin
            - export DOCKER_BUILDKIT=0
            - export TAG_VERSION=${BITBUCKET_TAG}
            - export MAJOR_VERSION=$(echo $TAG_VERSION | cut -d. -f1)
            - export MINOR_VERSION=$(echo $TAG_VERSION | cut -d. -f1,2)
            - export SHORT_SHA=$(echo $BITBUCKET_COMMIT | cut -c1-7)
            - docker build --platform linux/amd64 -t tariqsulehri/rct-backend:$TAG_VERSION -t tariqsulehri/rct-backend:$MINOR_VERSION -t tariqsulehri/rct-backend:$MAJOR_VERSION -t tariqsulehri/rct-backend:latest -t tariqsulehri/rct-backend:production-$SHORT_SHA .
            - docker push tariqsulehri/rct-backend:$TAG_VERSION
            - docker push tariqsulehri/rct-backend:$MINOR_VERSION
            - docker push tariqsulehri/rct-backend:$MAJOR_VERSION
            - docker push tariqsulehri/rct-backend:latest
            - docker push tariqsulehri/rct-backend:production-$SHORT_SHA
